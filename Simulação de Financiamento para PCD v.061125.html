<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Financiamento</title>
    <!-- Carrega Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define a fonte Inter (Google Font) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }

        /* Estilos de impressão (para garantir que só a prévia seja impressa) */
        @media print {
            body {
                background-color: white !important;
                /* REDUÇÃO GERAL DO ESPAÇAMENTO NA IMPRESSÃO */
                line-height: 1.2 !important; 
                font-size: 10pt !important;
            }
            /* Esconde o cabeçalho e os botões na impressão, incluindo a div de botões de alternância */
            .no-print, #form-container, #toggle-buttons {
                display: none !important;
            }
            /* Garante que a prévia da simulação ocupe 100% da largura na impressão */
            #preview-container {
                margin: 0;
                padding: 0;
                width: 100% !important;
            }
            /* Remove sombras e bordas do documento impresso para economizar tinta */
            #simulation-output > div {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
            /* Garante que o espaçamento entre parágrafos dentro dos blocos de dados seja reduzido */
            #simulation-output p {
                margin-top: 0;
                margin-bottom: 0;
            }
        }
        /* Classe base para inputs, aplicada via JS */
        .input-base {
            padding: 0.75rem;
            border: 1px solid #d1d5db; /* gray-300 */
            border-radius: 0.5rem; /* rounded-lg */
            transition: all 0.15s ease-in-out;
            width: 100%;
        }
        .input-base:focus {
            outline: none;
            border-color: #4f46e5; /* indigo-600 */
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.5); /* ring-indigo-500 */
        }
    </style>
</head>
<body class="p-4 lg:p-8">

    <!-- Cabeçalho Principal (Não aparece na impressão) -->
    <header class="no-print mb-6 text-center">
        <h1 class="text-4xl font-extrabold text-indigo-700">Simulador de Proposta</h1>
        <p class="text-gray-500 mt-2">Preencha os dados e veja a simulação em tempo real.</p>
    </header>

    <!-- Container Principal do App -->
    <div id="app" class="flex flex-col lg:flex-row gap-6 max-w-7xl mx-auto flex-wrap">
        
        <!-- COLUNA 1: FORMULÁRIO DE EDIÇÃO (Visível apenas no modo de edição) -->
        <div id="form-container" class="lg:w-1/2 p-6 bg-white rounded-xl shadow-2xl w-full">
            <h2 class="text-2xl font-bold mb-4 text-indigo-800">1. Preenchimento dos Dados</h2>
            
            <!-- FORMULÁRIO -->
            <form id="simulation-form" class="space-y-6">

                <!-- Dados do Cliente -->
                <fieldset class="border border-indigo-300 p-4 rounded-lg">
                    <legend class="text-lg font-semibold px-2 text-indigo-600">Dados do Cliente</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                        <div class="flex flex-col">
                            <label for="nome" class="text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                            <input id="nome" type="text" placeholder="Valentim Longo" class="input-base" value="ex: Valentim Longo">
                        </div>
                        <div class="flex flex-col">
                            <label for="cpf" class="text-sm font-medium text-gray-700 mb-1">CPF</label>
                            <input id="cpf" type="text" placeholder="000.000.000-00" class="input-base" value="ex: 070.692.478-93">
                        </div>
                        <div class="flex flex-col md:col-span-2">
                            <label for="endereco" class="text-sm font-medium text-gray-700 mb-1">Endereço (Rua, Número)</label>
                            <input id="endereco" type="text" placeholder="RUA FIORAVANTE CHINELATTO 791" class="input-base" value="ex: RUA FIORAVANTE CHINELATTO 791">
                        </div>
                        <div class="flex flex-col">
                            <label for="bairro" class="text-sm font-medium text-gray-700 mb-1">Bairro</label>
                            <input id="bairro" type="text" placeholder="VILA DAINESE" class="input-base" value="ex: VILA DAINESE">
                        </div>
                        <div class="flex flex-col">
                            <label for="cep" class="text-sm font-medium text-gray-700 mb-1">CEP</label>
                            <input id="cep" type="text" placeholder="00000-000" class="input-base" value="ex: 13469-240">
                        </div>
                        <div class="flex flex-col md:col-span-2">
                            <label for="cidadeUf" class="text-sm font-medium text-gray-700 mb-1">Cidade/UF</label>
                            <input id="cidadeUf" type="text" placeholder="Americana/SP" class="input-base" value="ex: AMERICANA/SP">
                        </div>
                    </div>
                </fieldset>

                <!-- Dados do Veículo -->
                <fieldset class="border border-indigo-300 p-4 rounded-lg">
                    <legend class="text-lg font-semibold px-2 text-indigo-600">Dados do Veículo</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                        <div class="flex flex-col">
                            <label for="veiculoModelo" class="text-sm font-medium text-gray-700 mb-1">Veículo/Modelo</label>
                            <input id="veiculoModelo" type="text" placeholder="CITROEN/BASALT FEEL TURBO AT" class="input-base" value="ex: CITROEN/BASALT FEEL TURBO AT">
                        </div>
                        <div class="flex flex-col">
                            <label for="cor" class="text-sm font-medium text-gray-700 mb-1">Cor</label>
                            <input id="cor" type="text" placeholder="BRANCO (BLANC BANQUISE)" class="input-base" value="ex: BRANCO (BLANC BANQUISE)">
                        </div>
                        <div class="flex flex-col">
                            <label for="anoModelo" class="text-sm font-medium text-gray-700 mb-1">Ano/Modelo</label>
                            <input id="anoModelo" type="text" placeholder="AAAA/AAAA (ex: 2025/2025)" class="input-base" value="ex: 2025/2025">
                        </div>
                        <div class="flex flex-col">
                            <label for="especie" class="text-sm font-medium text-gray-700 mb-1">Espécie</label>
                            <input id="especie" type="text" placeholder="Passageiro" class="input-base" value="ex: PASSAGEIRO">
                        </div>
                        <div class="flex flex-col">
                            <label for="tipo" class="text-sm font-medium text-gray-700 mb-1">Tipo</label>
                            <input id="tipo" type="text" placeholder="5 Lugares" class="input-base" value="ex: 5 LUGARES">
                        </div>
                        <div class="flex flex-col">
                            <label for="direcao" class="text-sm font-medium text-gray-700 mb-1">Direção</label>
                            <input id="direcao" type="text" placeholder="Elétrica" class="input-base" value="ex: ELÉTRICA">
                        </div>
                        <div class="flex flex-col">
                            <label for="cambio" class="text-sm font-medium text-gray-700 mb-1">Câmbio</label>
                            <input id="cambio" type="text" placeholder="Automático" class="input-base" value="ex: AUTOMÁTICO">
                        </div>
                    </div>
                </fieldset>

                <!-- Simulação de Financiamento -->
                <fieldset class="border border-indigo-300 p-4 rounded-lg">
                    <legend class="text-lg font-semibold px-2 text-indigo-600">Valores e Parcelas</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                        <div class="flex flex-col">
                            <label for="valorVeiculo" class="text-sm font-medium text-gray-700 mb-1">Valor do Veículo (R$)</label>
                            <input id="valorVeiculo" type="number" step="0.01" placeholder="93441.00" class="input-base" value="0.00">
                        </div>
                        <div class="flex flex-col">
                            <label for="valorEntrada" class="text-sm font-medium text-gray-700 mb-1">Valor da Entrada (R$)</label>
                            <input id="valorEntrada" type="number" step="0.01" placeholder="85000.00" class="input-base" value="0.00">
                        </div>
                        
                        <!-- CAMPO AUTOMÁTICO PARA VALOR A FINANCIAR -->
                        <div class="flex flex-col col-span-full mt-2 p-3 bg-indigo-100 rounded-lg border-2 border-indigo-300">
                            <label class="text-base font-bold text-indigo-800 mb-1">VALOR A FINANCIAR (Cálculo Automático):</label>
                            <span id="valorFinanciarDisplay" class="text-2xl font-extrabold text-indigo-900">
                                R$ 0,00
                            </span>
                        </div>
                        <!-- FIM DO CAMPO DE CÁLCULO -->

                        <div class="flex flex-col mt-4">
                            <label for="qtdeParcelas" class="text-sm font-medium text-gray-700 mb-1">Quantidade de Parcelas</label>
                            <input id="qtdeParcelas" type="number" placeholder="60" class="input-base" value="ex: 60">
                        </div>
                        <div class="flex flex-col mt-4">
                            <label for="valorParcela" class="text-sm font-medium text-gray-700 mb-1">Valor da Parcela (R$)</label>
                            <input id="valorParcela" type="number" step="0.01" placeholder="318.39" class="input-base" value="0.00">
                        </div>
                        
                        <!-- NOVO CAMPO PARA DATA DE VALIDADE -->
                        <div class="flex flex-col md:col-span-2 mt-4">
                            <label for="dataValidade" class="text-sm font-medium text-gray-700 mb-1">Data de Validade da Proposta</label>
                            <input id="dataValidade" type="date" class="input-base" value="ex: 20/08/2025">
                        </div>
                        <!-- FIM DO NOVO CAMPO -->
                    </div>
                </fieldset>
            </form>
        </div>

        <!-- COLUNA 2: PRÉ-VISUALIZAÇÃO (Sempre visível, mas pode ser escondida/mostrada pelo JavaScript) -->
        <div id="preview-container" class="lg:w-1/2 w-full">
            <h2 class="text-2xl font-bold mb-4 text-indigo-800 no-print">2. Prévia do Documento</h2>
            <!-- O conteúdo da simulação será injetado aqui pelo JavaScript -->
            <div id="simulation-output" class="min-h-96">
                <!-- Conteúdo inicial será carregado por JS -->
            </div>
            <!-- Botões de ação no modo prévia (Imprimir/Voltar) serão injetados aqui abaixo quando o modo for ativado -->
        </div>

        <!-- Botões de Ação (VISUALIZAR/IMPRIMIR/VOLTAR) - Movido para fora para ser independente do formulário -->
        <div id="toggle-buttons" class="no-print mt-8 w-full">
            <!-- Conteúdo inicial será o botão de Visualizar, injetado pelo JS -->
        </div>
    </div>

        /**
         * Formata um valor numérico para moeda BRL.
         * @param {number} value - O valor a ser formatado.
         * @returns {string} O valor formatado como R$.
         */
        const formatCurrency = (value) => {
            // Garante que valores nulos/NaN sejam tratados como 0 para exibição
            if (isNaN(value) || value === null) {
                return currencyFormatter.format(0);
            }
            return currencyFormatter.format(value);
        };
        
        /**
         * Converte uma string de data YYYY-MM-DD para o formato DD/MM/YYYY.
         * @param {string} dateString - A data no formato YYYY-MM-DD.
         * @returns {string} A data no formato DD/MM/YYYY.
         */
        const formatDate = (dateString) => {
            if (!dateString) return '______';
            const [year, month, day] = dateString.split('-');
            // Verifica se a string tem o formato esperado
            if (year && month && day && year.length === 4) {
                 return `${day}/${month}/${year}`;
            }
            return dateString; // Retorna a string original se o formato for inválido
        };

                    </div>

                    <!-- DADOS DO VEÍCULO -->
                    <div class="mb-4 p-3 border-b-2 border-indigo-200"> <!-- mb-6 para mb-4; p-4 para p-3 -->
                        <h2 class="text-lg font-semibold mb-2 text-indigo-600 print:text-black">DADOS DO VEÍCULO:</h2> <!-- text-xl para text-lg; mb-3 para mb-2 -->
                        <div class="text-sm space-y-1 text-gray-800 print:text-black"> <!-- space-y-2 para space-y-1 -->
                            <p><strong>VEICULO/MODELO:</strong> ${data.veiculoModelo.toUpperCase()}</p>
                            <p><strong>COR:</strong> ${data.cor.toUpperCase()}</p>
                            <p><strong>ANO/MODELO:</strong> ${data.anoModelo}</p>
                            <p><strong>ESPÉCIE:</strong> ${data.especie.toUpperCase()}</p>
                            <p><strong>TIPO:</strong> ${data.tipo.toUpperCase()}</p>
                            <p><strong>DIREÇÃO:</strong> ${data.direcao.toUpperCase()}</p>
                            <p><strong>CÂMBIO:</strong> ${data.cambio.toUpperCase()}</p>
                        </div>
                    </div>

                    <!-- SIMULAÇÃO DE FINANCIAMENTO -->
                    <div class="mb-6 p-3 border-b-2 border-indigo-200 bg-indigo-50 rounded-md print:bg-white print:text-black"> <!-- mb-8 para mb-6; p-4 para p-3 -->
                        <h2 class="text-lg font-semibold mb-2 text-indigo-600 print:text-black">SIMULAÇÃO DE FINANCIAMENTO:</h2> <!-- text-xl para text-lg; mb-3 para mb-2 -->
                        <div class="text-sm space-y-1 font-mono text-gray-800 print:text-black"> <!-- space-y-2 para space-y-1 -->
                            <p><strong>VALOR DO VEÍCULO:</strong> ${formatCurrency(data.valorVeiculo)}</p>
                            <p><strong>VALOR DA ENTRADA:</strong> ${formatCurrency(data.valorEntrada)}</p>
                            <p class="text-base font-extrabold mt-2 text-indigo-800"> <!-- text-lg para text-base; mt-4 para mt-2 -->
                                <strong>VALOR A FINANCIAR:</strong> ${formatCurrency(valorFinanciar)}
                            </p>
                            <p class="mt-2"><strong>QTDE DE PARCELAS:</strong> ${data.qtdeParcelas}</p> <!-- mt-4 para mt-2 -->
                            <p><strong>VALOR DA PARCELA:</strong> ${formatCurrency(data.valorParcela)}</p>
                        </div>
                    </div>

                    <!-- OBSERVAÇÕES -->
                    <div class="p-3 border-t-2 border-indigo-200 print:text-black"> <!-- p-4 para p-3 -->
                        <p class="text-xs italic mb-0 text-gray-800"> <!-- mb-1 para mb-0 -->
                            <strong class="text-xs">${obsText}</strong> <!-- text-sm para text-xs -->
                            <br>
                            ${obsComplemento}
                        </p>
                        <p class="text-sm font-semibold mt-1 text-indigo-600"><strong>VALIDADE:</strong> ${validadeStr}</p> <!-- mt-2 para mt-1 -->
                    </div>
                </div>
            `;

            document.getElementById('simulation-output').innerHTML = previewHtml;
        }

        /**
         * Alterna entre o modo de edição (formulário) e o modo de visualização/impressão (prévia).
         * @param {'edit'|'preview'} mode - O modo para o qual alternar.
         */
        function toggleView(mode) {
            const formContainer = document.getElementById('form-container');
            const previewContainer = document.getElementById('preview-container');
            const toggleButtons = document.getElementById('toggle-buttons');

            if (mode === 'preview') {
                updatePreview(); // Garante que a prévia está 100% atualizada
                
                // Esconde formulário, faz a prévia ocupar 100% da largura na tela grande
                formContainer.classList.add('hidden');
                previewContainer.classList.add('lg:w-full');
                previewContainer.classList.remove('lg:w-1/2');
                
                // Atualiza botões: Voltar e Imprimir
                toggleButtons.classList.remove('hidden');
                toggleButtons.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-4 justify-center">
                        <!-- BOTÃO IMPRIMIR -->
                        <button onclick="window.print()" class="w-full lg:w-auto px-6 py-3 bg-green-600 text-white font-semibold rounded-lg shadow-xl hover:bg-green-700 transition-colors focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 4v2a2 2 0 002 2h6a2 2 0 002-2V4h1a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V6a2 2 0 012-2h1zM3 16h14V9H3v7zM7 5a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>
                            Imprimir Simulação
                        </button>
                        <!-- BOTÃO VOLTAR PARA EDIÇÃO -->
                        <button onclick="toggleView('edit')" class="w-full lg:w-auto px-6 py-3 bg-gray-300 text-gray-800 font-semibold rounded-lg shadow-xl hover:bg-gray-400 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                            Voltar para Edição
                        </button>
                    </div>
                `;
            } else { // mode === 'edit'
                // Mostra formulário, retorna prévia ao tamanho original (duas colunas)
                formContainer.classList.remove('hidden');
                previewContainer.classList.add('lg:w-1/2');
                previewContainer.classList.remove('lg:w-full');
                
                // Retorna botões ao estado inicial: Visualizar
                toggleButtons.classList.remove('hidden');
                toggleButtons.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-4 justify-center">
                        <button onclick="toggleView('preview')" class="w-full px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-xl hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 flex items-center justify-center">
                            Visualizar Simulação (Prévia) &rarr;
                        </button>
                    </div>
                `;
            }
        }

        /**
         * Inicializa a aplicação: 
         * 1. Adiciona listeners de input para atualização em tempo real.
         * 2. Carrega a prévia inicial com os dados mockados.
         */
        function initApp() {
            // Adiciona listeners para atualizar a prévia a cada alteração
            const formInputs = document.querySelectorAll('#simulation-form input[type="text"], #simulation-form input[type="number"], #simulation-form input[type="date"]');
            formInputs.forEach(input => {
                input.addEventListener('input', updatePreview);
                
                // Aplica a classe de estilo base para todos os inputs
                input.classList.add('input-base');
            });
            
            // Define a data de validade inicial (2025-08-20, baseado no arquivo anexo)
            const validadeInput = document.getElementById('dataValidade');
            if (validadeInput && !validadeInput.value) {
                // Ajusta a data para o formato YYYY-MM-DD
                validadeInput.value = '2025-08-20'; 
            }

            // Inicia a aplicação no modo de edição (que também carrega a prévia)
            toggleView('edit');
        }

        // Inicia a aplicação após o carregamento da página
        window.onload = initApp;

    </script>
</body>
</html>

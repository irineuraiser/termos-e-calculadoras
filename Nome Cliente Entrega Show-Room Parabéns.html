<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placa Entrega Show-Room - Citroën Le Mans</title>
  <!-- Tailwind CSS para estrutura responsiva e limpa -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonte Montserrat ExtraBold/Black idêntica à tipografia do modelo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    /* Configuração da folha A4 Paisagem para impressão sem margens extras */
    @page {
      size: A4 landscape;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', 'Arial Black', Arial, sans-serif;
      background-color: #e5e7eb;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Folha A4 Paisagem exata: 297mm de largura x 210mm de altura */
    .folha-a4 {
      width: 297mm;
      height: 210mm;
      background-color: #ffffff;
      padding: 10mm 14mm 10mm 14mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    /* Integra o fundo branco das imagens PNG perfeitamente à folha */
    .logo-img {
      mix-blend-mode: multiply;
      object-fit: contain;
      user-select: none;
    }

    /* Sombra projetada suave idêntica à imagem modelo */
    .texto-com-sombra {
      color: #000000;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 3px 4px 5px rgba(0, 0, 0, 0.28);
      letter-spacing: 0.02em;
    }

    /* Campo editável do nome do cliente */
    .campo-cliente {
      width: 100%;
      min-height: 140px;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      background-color: rgba(248, 250, 252, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.28;
      padding: 10px 16px;
      outline: none;
      cursor: text;
      word-break: break-word;
      transition: all 0.2s ease;
    }

    .campo-cliente:hover,
    .campo-cliente:focus {
      border-color: #dc2626;
      background-color: #fff5f5;
    }

    /* Regras de impressão: oculta controles e bordas tracejadas */
    @media print {
      body {
        background: #ffffff !important;
      }
      .no-print {
        display: none !important;
      }
      .folha-a4 {
        box-shadow: none !important;
        margin: 0 !important;
        width: 297mm !important;
        height: 210mm !important;
      }
      .campo-cliente {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
      }
    }
  </style>
</head>
<body>

  <!-- Barra de ferramentas superior (visível apenas na tela, desaparece ao imprimir) -->
  <div class="no-print w-full max-w-[297mm] bg-zinc-900 text-white px-5 py-3 my-4 rounded-xl shadow-lg flex flex-wrap items-center justify-between gap-4 font-sans">
    <div class="flex items-center gap-3">
      <span class="inline-block w-3 h-3 rounded-full bg-red-600"></span>
      <span class="text-sm text-zinc-200">
        Clique sobre <strong>NOME DO CLIENTE EXEMPLO</strong> na folha para digitar o nome do comprador:
      </span>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <!-- Controles de tamanho da fonte para nomes muito longos ou curtos -->
      <div class="flex items-center bg-zinc-800 rounded-lg p-1 border border-zinc-700">
        <button
          type="button"
          onclick="ajustarFonte(-4)"
          title="Diminuir tamanho do nome"
          class="px-3 py-1.5 text-xs font-bold hover:bg-zinc-700 rounded-md transition cursor-pointer"
        >
          A-
        </button>
        <span id="indicador-fonte" class="px-2.5 text-xs text-zinc-300 font-mono">68px</span>
        <button
          type="button"
          onclick="ajustarFonte(4)"
          title="Aumentar tamanho do nome"
          class="px-3 py-1.5 text-xs font-bold hover:bg-zinc-700 rounded-md transition cursor-pointer"
        >
          A+
        </button>
      </div>

      <!-- Botão para limpar rapidamente o campo -->
      <button
        type="button"
        onclick="limparNome()"
        class="bg-zinc-700 hover:bg-zinc-600 text-white text-xs font-semibold px-3.5 py-2.5 rounded-lg transition cursor-pointer"
      >
        Limpar Nome
      </button>

      <!-- Botão principal de impressão -->
      <button
        type="button"
        onclick="window.print()"
        class="bg-red-600 hover:bg-red-700 text-white text-sm font-bold px-5 py-2 rounded-lg shadow transition flex items-center gap-2 cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6v-8z"/>
        </svg>
        Imprimir A4 Paisagem
      </button>
    </div>
  </div>

  <!-- Folha A4 Paisagem idêntica ao modelo -->
  <main class="folha-a4">

    <!-- CABEÇALHO SUPERIOR: Logo Citroën à esquerda e Logo Le Mans à direita -->
    <header class="w-full flex items-center justify-between pt-1">
      <!-- Logo Citroën (logo_citroen.png) -->
      <div class="flex items-center">
        <img
          src="logo_citroen.png"
          alt="Citroën"
          class="logo-img h-[76px] w-auto"
          onerror="this.onerror=null; this.src='https://placehold.co/320x76/ffffff/000000?text=CITROEN+(logo_citroen.png)';"
        >
      </div>

      <!-- Logo Le Mans (logo_lemans.png) -->
      <div class="flex items-center">
        <img
          src="logo_lemans.png"
          alt="Le Mans"
          class="logo-img h-[86px] w-auto"
          onerror="this.onerror=null; this.src='https://placehold.co/320x86/ffffff/000000?text=Le+Mans+(logo_lemans.png)';"
        >
      </div>
    </header>

    <!-- MIOLO CENTRAL: PARABÉNS !!! + Campo Editável do Cliente -->
    <section class="w-full flex-1 flex flex-col items-center justify-center my-2 px-4">
      <h1 class="texto-com-sombra text-[74px] leading-none mb-7 select-none text-center">
        PARABÉNS !!!
      </h1>

      <div
        id="nome-cliente"
        contenteditable="true"
        spellcheck="false"
        class="campo-cliente texto-com-sombra"
        style="font-size: 68px;"
        onfocus="selecionarExemplo(this)"
        onblur="restaurarSeVazio(this)"
      >NOME DO CLIENTE<br>EXEMPLO</div>
    </section>

    <!-- RODAPÉ INFERIOR CENTRALIZADO: Logo Grupo Stefanini (logo_stefanini.png) -->
    <footer class="w-full flex items-center justify-center pb-1">
      <img
        src="logo_stefanini.png"
        alt="Grupo Stefanini"
        class="logo-img h-[78px] w-auto"
        onerror="this.onerror=null; this.src='https://placehold.co/280x78/ffffff/000000?text=Grupo+Stefanini+(logo_stefanini.png)';"
      >
    </footer>

  </main>

  <script>
    // Tamanho inicial da fonte do nome do cliente (em pixels)
    let tamanhoFonteAtual = 68;

    // Permite aumentar ou diminuir o tamanho do nome caso o cliente tenha nome muito longo
    function ajustarFonte(delta) {
      const campo = document.getElementById('nome-cliente');
      const indicador = document.getElementById('indicador-fonte');
      tamanhoFonteAtual = Math.min(96, Math.max(32, tamanhoFonteAtual + delta));
      campo.style.fontSize = tamanhoFonteAtual + 'px';
      indicador.textContent = tamanhoFonteAtual + 'px';
    }

    // Ao clicar no campo com o texto de exemplo, limpa automaticamente para digitação imediata
    function selecionarExemplo(elemento) {
      const textoLimpo = elemento.innerText.replace(/\s+/g, ' ').trim().toUpperCase();
      if (textoLimpo === 'NOME DO CLIENTE EXEMPLO') {
        elemento.innerHTML = '';
      }
    }

    // Se sair do campo sem digitar nada, volta o texto padrão de exemplo
    function restaurarSeVazio(elemento) {
      if (elemento.innerText.trim() === '') {
        elemento.innerHTML = 'NOME DO CLIENTE<br>EXEMPLO';
      }
    }

    // Limpa o nome e coloca o cursor pronto para digitar
    function limparNome() {
      const campo = document.getElementById('nome-cliente');
      campo.innerHTML = '';
      campo.focus();
    }
  </script>

</body>
</html>
